<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="易富路 RAG · 企业知识问答">
  <title>易富路 RAG · 智能问答</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./product.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body class="chat-page">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="./" aria-label="易富路 RAG">
        <img class="brand-logo" src="./logo.svg" width="41" height="41" alt=""><span>易富路 <b>RAG</b></span>
      </a>
      <button id="new-conversation" class="button button-primary sidebar-new" type="button">
        <span data-icon="plus"></span> 新建对话
      </button>
      <div class="sidebar-group">
        <div class="sidebar-section-title">最近对话</div>
        <div id="conversation-list" class="history" aria-label="本次浏览的对话"></div>
      </div>
      <div class="sidebar-bottom">
        <a class="sidebar-link" href="./admin.html"><span data-icon="book"></span> 管理后台</a>
        <a class="sidebar-link" href="https://github.com/ProfessorZJH/yifulu_rag" target="_blank" rel="noopener noreferrer">
          <span data-icon="external"></span> GitHub
        </a>
      </div>
    </aside>
    <main class="chat-main" id="chat-main">
      <header class="chat-header">
        <div class="header-leading">
          <button type="button" class="icon-button mobile-toggle" id="mobile-toggle" aria-label="展开菜单"><span data-icon="menu"></span></button>
          <strong>知识问答</strong>
        </div>
        <div class="header-actions">
          <label for="knowledge-base" class="sr-only">当前知识库</label>
          <select id="knowledge-base" class="select-knowledge" aria-label="选择知识库" disabled>
            <option value="">知识库</option>
          </select>
        </div>
      </header>
      <div id="chat-scroll" class="chat-scroll">
        <section class="welcome" id="welcome">
          <div class="welcome-glow" aria-hidden="true"></div>
          <div class="welcome-content" id="welcome-content">
            <img class="welcome-mark" src="./logo.svg" width="78" height="78" alt="">
            <h1>今天想了解什么？</h1>
            <div id="suggestions" class="suggestion-list" hidden></div>
          </div>
        </section>
        <section id="message-list" class="message-list" aria-live="polite" aria-relevant="additions"></section>
      </div>
      <div class="chat-input-wrap" id="chat-input-wrap">
        <form id="chat-form" class="chat-input">
          <label class="sr-only" for="question">问题</label>
          <textarea id="question" rows="1" maxlength="2000" placeholder="向知识库提问..." aria-label="输入问题"></textarea>
          <div class="input-actions">
            <span id="service-state" class="service-state" hidden></span>
            <button id="send-button" class="send-button" type="submit" aria-label="发送消息"><span data-icon="arrowUp"></span></button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
  <div class="drawer-backdrop" id="source-backdrop" hidden></div>
  <aside class="source-drawer" id="source-drawer" aria-label="回答来源" aria-modal="true" role="dialog" hidden>
    <div class="drawer-header"><h2>引用来源</h2><button type="button" id="source-close" class="icon-button" aria-label="关闭来源"><span data-icon="x"></span></button></div>
    <div id="source-items" class="source-items"></div>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
